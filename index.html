<head>

  <link id="favicon-16" rel="icon" href="/assets/favicons/darkpurple-16.png" type="image/png" sizes="16x16" />

  <style>
    body {
      background: #fff;
    }

    /* Header overlays the hero so the video is full-bleed behind the nav */
    #page-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
    }

    #page-header:not(.header-scrolled),
    #page-header.header-scrolled {
      background: transparent !important;
      border-bottom-color: transparent !important;
    }

    #page-header:not(.header-scrolled) .site-name {
      color: #000 !important;
    }

    #page-header:not(.header-scrolled) .hamburger-bar {
      background: #000 !important;
    }

    #page-header.nav-open {
      background: #fff !important;
    }

    .hero-video-section {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #fff;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Soft white gradient behind the scroll cue; fades the video into the page */
    .hero-video-section::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14rem;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff);
      pointer-events: none;
      z-index: 1;
    }

    /* Scroll cue: fades out once the hero is scrolled past (see js below) */
    .scroll-cue {
      position: absolute;
      left: 50%;
      bottom: 2rem;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: #111;
      opacity: 1;
      transition: opacity 300ms ease;
      pointer-events: none;
    }

    .scroll-cue.is-hidden {
      opacity: 0;
    }

    .scroll-cue-label {
      font-size: var(--font-size-xs);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .scroll-cue-arrow {
      animation: scroll-cue-bounce 1.8s ease-in-out infinite;
    }

    @keyframes scroll-cue-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(0.35rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-cue-arrow {
        animation: none;
      }
    }

    /* Quote — same display voice as the About hero, centered in a photo field */
    .home-quote-section {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 8.5rem var(--container-padding);
      margin-bottom: 14rem;
      overflow: hidden;
      text-align: center;
    }

    .home-quote-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .home-quote-photo {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
      margin: 0;
      overflow: hidden;
      border-radius: 0.45rem;
      background: var(--color-bg-subtle);
      box-shadow: 0 0 0 1px #e0e0e0, 0 14px 36px rgba(0, 0, 0, 0.08);
      opacity: 0;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .home-quote-photo--lg { z-index: 1; }
    .home-quote-photo--md { z-index: 2; }
    .home-quote-photo--sm { z-index: 3; }

    .home-quote-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--pos, center);
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .home-quote-copy {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 36rem;
    }

    .home-quote-copy::before {
      content: '';
      position: absolute;
      inset: -5.5rem -7rem;
      background: radial-gradient(ellipse at center, #fff 38%, rgba(255, 255, 255, 0) 72%);
      pointer-events: none;
      z-index: -1;
    }

    .section-eyebrow {
      margin: 0 0 1.25rem;
      text-align: center;
    }

    .home-quote {
      margin: 0;
      font-weight: 800;
      font-size: clamp(3.05rem, 7vw, 6.35rem);
      line-height: 0.86;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      color: #111;
    }

    .home-quote-lede {
      margin: 1.15rem auto 0;
      max-width: 28rem;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      text-wrap: pretty;
    }

    .home-quote-link {
      margin-top: 1.35rem;
    }

    /* Client logo marquee — continuous, seamless loop; pauses on hover */
    .clients-section {
      padding-top: 18rem;
      padding-bottom: 11rem;
    }

    .clients-section .section-eyebrow {
      margin-bottom: 2.25rem;
    }

    .clients-marquee {
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
      mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
    }

    .clients-track {
      display: flex;
      width: max-content;
      animation: clients-scroll 90s linear infinite;
    }

    .clients-track:hover {
      animation-play-state: paused;
    }

    .clients-group {
      display: flex;
      align-items: center;
      gap: 6.75rem;
      flex: 0 0 auto;
      padding: 0 3.375rem;
    }

    .client-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      height: 3.5rem;
      padding: 0;
      text-decoration: none;
      color: inherit;
    }

    .client-tile:focus-visible {
      outline: 1px solid var(--color-text);
      outline-offset: 0.4rem;
      border-radius: 0.25rem;
    }

    .client-tile img {
      display: block;
      height: 3.5rem;
      width: auto;
      max-height: 3.5rem;
      object-fit: contain;
      object-position: center;
      filter: grayscale(1) opacity(0.55);
      transition: filter 220ms ease, opacity 220ms ease;
    }

    .client-tile:hover img,
    .client-tile:focus-visible img {
      filter: none;
      opacity: 1;
    }

    @keyframes clients-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .clients-track {
        animation: none;
      }

      .home-quote-photo {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
        will-change: auto;
      }
    }

    @media (max-width: 70rem) {
      .home-quote-photo--sm {
        display: none;
      }
    }

    @media (max-width: 48rem) {
      .home-quote-section {
        min-height: 38rem;
        padding: 7.5rem var(--container-padding) 8.5rem;
        margin-bottom: 8rem;
      }

      .clients-section {
        padding-top: 10rem;
      }

      .home-quote-photo--md {
        display: none;
      }

      .home-quote-copy::before {
        inset: -3.5rem -2.5rem;
      }

      .home-quote-photo {
        width: calc(var(--w) * 0.52);
        height: calc(var(--h) * 0.52);
      }

      .home-quote-photo:nth-child(1) { --x: 16%; --y: 9%; }
      .home-quote-photo:nth-child(5) { --x: 86%; --y: 9%; }
      .home-quote-photo:nth-child(9) { --x: 86%; --y: 91%; }
      .home-quote-photo:nth-child(13) { --x: 16%; --y: 91%; }

      .home-quote {
        font-size: clamp(2.85rem, 12vw, 4.6rem);
      }

      .client-tile {
        height: 2.75rem;
      }

      .client-tile img {
        height: 2.75rem;
        max-height: 2.75rem;
      }

      .clients-group {
        gap: 4.75rem;
        padding: 0 2.375rem;
      }

      .clients-track {
        animation-duration: 70s;
      }
    }
  </style>

  <script>
    var video = document.getElementById('hero-video');

    function tryPlay() { var p = video.play(); if (p && p.catch) p.catch(function () {}); }

    // Multiple attempts — iOS Safari requires at least one of these to fire for muted autoplay
    tryPlay();
    video.addEventListener('loadedmetadata', tryPlay, { once: true });
    video.addEventListener('canplay',        tryPlay, { once: true });
    video.addEventListener('loadeddata',     tryPlay, { once: true });
    setTimeout(tryPlay, 100);
    setTimeout(tryPlay, 500);
    setTimeout(tryPlay, 1500);

    // Tap/click on the video itself triggers play (mobile fallback + desktop Safari)
    video.addEventListener('click', tryPlay);

    // Skip the first second of intro so the loop starts mid-motion
    var skipped = false;
    function skipIntro() {
      if (skipped) return;
      skipped = true;
      video.currentTime = 1;
    }
    video.addEventListener('loadedmetadata', skipIntro, { once: true });
    video.addEventListener('canplay', skipIntro, { once: true });
    setTimeout(skipIntro, 200);

    var scrollCue = document.querySelector('.scroll-cue');
    if (scrollCue) {
      window.addEventListener('scroll', function () {
        scrollCue.classList.toggle('is-hidden', window.scrollY > 24);
      }, { passive: true });
    }

    (function initQuoteField() {
      var section = document.querySelector('[data-quote-field]');
      if (!section) return;

      var photos = Array.prototype.slice.call(section.querySelectorAll('.home-quote-photo'));
      if (!photos.length) return;

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      function restTransform(el) {
        var rot = el.getAttribute('data-rot') || '0';
        el.style.opacity = '1';
        el.style.transform = 'translate(-50%, -50%) rotate(' + rot + 'deg)';
      }

      if (reduceMotion) {
        photos.forEach(restTransform);
        return;
      }

      var STIFF = 0.062;
      var DAMP = 0.8;
      var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
      var started = false;
      var startTime = 0;
      var lastTime = 0;
      var raf = 0;

      photos.forEach(function (el) {
        var x = parseFloat(el.getAttribute('data-x'));
        var y = parseFloat(el.getAttribute('data-y'));
        var rot = parseFloat(el.getAttribute('data-rot')) || 0;
        el._q = {
          rot: rot,
          depth: parseFloat(el.getAttribute('data-depth')) || 0.5,
          delay: parseFloat(el.getAttribute('data-delay')) || 0,
          fromX: (x - 50) * 2.2,
          fromY: (y - 50) * 2.4,
          fromRot: x < 50 ? -14 : 14,
          px: 0,
          py: 0,
          pr: x < 50 ? -14 : 14,
          ps: 0.72,
          po: 0,
          vx: 0,
          vy: 0,
          vr: 0,
          primed: false,
          phase: (x * 0.17 + y * 0.13) % (Math.PI * 2),
          freq: 0.28 + ((x + y) % 17) / 42,
          amp: 16 + ((x * y) % 22)
        };
      });

      function springTo(state, velKey, posKey, target, stiff, damp, dt) {
        state[velKey] += (target - state[posKey]) * stiff * dt;
        state[velKey] *= Math.pow(damp, dt);
        state[posKey] += state[velKey] * dt;
      }

      function tick(now) {
        if (!started) {
          raf = 0;
          return;
        }
        raf = requestAnimationFrame(tick);
        if (!startTime) startTime = now;
        var dt = lastTime ? Math.min(32, now - lastTime) / 16.67 : 1;
        lastTime = now;
        var t = (now - startTime) / 1000;
        var w = section.clientWidth;
        var h = section.clientHeight;

        mouse.x += (mouse.tx - mouse.x) * (1 - Math.pow(0.9, dt));
        mouse.y += (mouse.ty - mouse.y) * (1 - Math.pow(0.9, dt));

        photos.forEach(function (el) {
          var q = el._q;
          var fromXpx = q.fromX * (w / 100);
          var fromYpx = q.fromY * (h / 100);
          if (!q.primed) {
            q.px = fromXpx;
            q.py = fromYpx;
            q.primed = true;
          }

          var local = t - q.delay;
          var live = local >= 0;
          var intro = live ? Math.min(1, local / 1.35) : 0;
          var ease = 1 - Math.pow(1 - intro, 3.6);

          var floatX = live ? Math.sin(t * q.freq + q.phase) * q.amp : 0;
          var floatY = live ? Math.cos(t * q.freq * 0.82 + q.phase) * q.amp * 0.9 : 0;
          var parX = mouse.x * q.depth * 46;
          var parY = mouse.y * q.depth * 32;

          var tx = fromXpx * (1 - ease) + floatX + parX;
          var ty = fromYpx * (1 - ease) + floatY + parY;
          var tr = q.fromRot * (1 - ease) + q.rot + (live ? Math.sin(t * q.freq * 0.45 + q.phase) * 2 : 0);
          var ts = 0.72 + 0.28 * ease;
          var to = ease;

          springTo(q, 'vx', 'px', tx, STIFF, DAMP, dt);
          springTo(q, 'vy', 'py', ty, STIFF, DAMP, dt);
          springTo(q, 'vr', 'pr', tr, 0.075, 0.82, dt);
          q.ps += (ts - q.ps) * (1 - Math.pow(0.86, dt));
          q.po += (to - q.po) * (1 - Math.pow(0.84, dt));

          el.style.opacity = q.po;
          el.style.transform =
            'translate(-50%, -50%) translate3d(' + q.px.toFixed(2) + 'px,' + q.py.toFixed(2) + 'px,0) rotate(' +
            q.pr.toFixed(2) + 'deg) scale(' + q.ps.toFixed(3) + ')';
        });
      }

      function startLoop() {
        if (started) return;
        started = true;
        lastTime = 0;
        if (!raf) raf = requestAnimationFrame(tick);
      }

      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) startLoop();
        });
      }, { threshold: 0, rootMargin: '12% 0px' });
      io.observe(section);

      if (finePointer) {
        section.addEventListener('mousemove', function (e) {
          var r = section.getBoundingClientRect();
          mouse.tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
          mouse.ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
        }, { passive: true });
        section.addEventListener('mouseleave', function () {
          mouse.tx = 0;
          mouse.ty = 0;
        });
      }
    })();
  </script>
