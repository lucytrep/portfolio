  <style>
    body {
      background: #fff;
    }

    /* Header overlays the hero so the video is full-bleed behind the nav */
    #page-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
    }

    #page-header:not(.header-scrolled),
    #page-header.header-scrolled {
      background: transparent !important;
      border-bottom-color: transparent !important;
    }

    #page-header:not(.header-scrolled) .hamburger-bar {
      background: #000 !important;
    }

    #page-header.nav-open {
      background: #fff !important;
    }

    .hero-video-section {
      position: relative;
      height: 92vh;
      height: 92dvh;
      overflow: hidden;
      background: #fff;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Soft white gradient behind the scroll cue; fades the video into the page */
    .hero-video-section::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14rem;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff);
      pointer-events: none;
      z-index: 1;
    }

    /* Quote — same display voice as the About hero, centered in a photo field */
    .home-quote-section {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 8.5rem var(--container-padding);
      margin-bottom: 0;
      overflow: hidden;
      text-align: center;
    }

    .home-quote-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .home-quote-photo {
      position: absolute;
      left: clamp(4.5rem, var(--x), calc(100% - 4.5rem));
      top: clamp(6.5rem, var(--y), calc(100% - 6.5rem));
      width: var(--w);
      height: auto;
      margin: 0;
      overflow: hidden;
      border-radius: var(--radius-photo);
      background: var(--color-bg-subtle);
      box-shadow:
        0 0 0 1px var(--color-hairline),
        0 calc(2px + var(--lift, 0) * 4px) calc(6px + var(--lift, 0) * 8px)
          rgba(0, 0, 0, calc(0.05 + var(--lift, 0) * 0.08));
      opacity: 0;
      will-change: transform, opacity;
      backface-visibility: hidden;
      pointer-events: none;
    }

    .home-quote-photo img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .home-quote-photo--cutout {
      overflow: visible;
      background: transparent;
      box-shadow: none;
    }

    .home-quote-photo--cutout img {
      filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.14));
    }

    .home-quote-copy {
      position: relative;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 36rem;
    }

    .home-quote-copy::before {
      content: '';
      position: absolute;
      inset: -5.5rem -7rem;
      background: radial-gradient(ellipse at center, #fff 38%, rgba(255, 255, 255, 0) 72%);
      pointer-events: none;
      z-index: -1;
    }

    .section-eyebrow {
      margin: 0 0 1.25rem;
      text-align: center;
    }

    .home-quote {
      margin: 0;
      font-size: var(--display-size);
      font-weight: var(--display-weight);
      line-height: var(--display-leading);
      letter-spacing: var(--display-tracking);
      text-transform: uppercase;
      color: var(--color-text);
    }

    .home-quote-lede {
      margin: 1.15rem auto 0;
      max-width: 28rem;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      text-wrap: pretty;
    }

    .home-quote-link {
      margin-top: 1.35rem;
    }

    /* Client logo marquee — equal slots, optically sized marks, seamless loop */
    .clients-section {
      --client-gap: 5.25rem;
      --client-logo-h: 4.25rem;
      --client-mark-h: 6rem;
      --client-wide-h: 3.85rem;
      padding-top: 5.5rem;
      padding-bottom: 7.5rem;
    }

    .clients-section .section-eyebrow {
      margin-bottom: 2.5rem;
    }

    .clients-marquee {
      overflow: hidden;
      padding-block: 1.25rem;
      -webkit-mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
      mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
    }

    .clients-track {
      display: flex;
      width: max-content;
      animation: clients-scroll 120s linear infinite;
      animation-play-state: running;
      will-change: transform;
    }

    .clients-group {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: var(--client-gap);
      padding-right: var(--client-gap);
    }

    .client-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: auto;
      height: 6.75rem;
      padding: 0;
      text-decoration: none;
      color: inherit;
    }

    .client-tile:focus-visible {
      outline: 1px solid var(--color-text);
      outline-offset: 0.4rem;
      border-radius: 0.25rem;
    }

    .client-tile img {
      display: block;
      width: auto;
      height: var(--client-logo-h);
      max-width: 12rem;
      object-fit: contain;
      object-position: center;
      filter: grayscale(1);
      opacity: 0.82;
      transition: filter 220ms ease, opacity 220ms ease;
    }

    .client-tile--mark img {
      height: var(--client-mark-h);
    }

    .client-tile--tall img {
      height: 6.5rem;
    }

    .client-tile img[src*="lego"] {
      height: 7.25rem;
    }

    .client-tile--wide img {
      height: var(--client-wide-h);
    }

    .client-tile img[src*="axe"] {
      height: 2.35rem;
    }

    .client-tile:hover img,
    .client-tile:focus-visible img {
      filter: none;
      opacity: 1;
    }

    @keyframes clients-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .clients-track {
        animation: none;
      }

      .home-quote-photo {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
        will-change: auto;
      }
    }

    @media (max-width: 70rem) {
      .home-quote-photo--sm {
        display: none;
      }
    }

    @media (max-width: 48rem) {
      .hero-video-section {
        height: 100vh;
        height: 100svh;
      }

      .hero-video {
        object-position: center top;
      }

      .home-quote-section {
        min-height: 38rem;
        padding: 7.5rem var(--container-padding) 8.5rem;
        margin-bottom: 0;
      }

      .clients-section {
        --client-gap: 3.75rem;
        --client-logo-h: 3.15rem;
        --client-mark-h: 4.5rem;
        --client-wide-h: 2.85rem;
        padding-top: 5rem;
      }

      .client-tile {
        height: 5.25rem;
      }

      .client-tile--tall img {
        height: 4.85rem;
      }

      .client-tile img[src*="lego"] {
        height: 5.5rem;
      }

      .client-tile img[src*="axe"] {
        height: 1.75rem;
      }

      .home-quote-photo--md {
        display: none;
      }

      .home-quote-copy::before {
        inset: -3.5rem -2.5rem;
      }

      .home-quote-photo {
        width: calc(var(--w) * 0.52);
        height: auto;
      }

      .home-quote-photo--mobile {
        display: block;
        width: clamp(4rem, 19vw, 5rem);
        opacity: 1 !important;
        transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) !important;
      }

      .home-quote-photo--mobile-tl { left: 14%; top: 11%; }
      .home-quote-photo--mobile-tc { left: 50%; top: 6%; width: clamp(5rem, 24vw, 6rem); }
      .home-quote-photo--mobile-tr { left: 86%; top: 12%; }
      .home-quote-photo--mobile-br { left: 86%; top: 89%; }
      .home-quote-photo--mobile-bl { left: 14%; top: 88%; }

      .home-quote {
        font-size: var(--display-size-compact);
      }

      .clients-track {
        animation-duration: 90s;
      }
    }
  </style>
</head>

  <script>
    var video = document.getElementById('hero-video');
    var heroQuery = window.matchMedia('(max-width: 800px)');

    function heroFile() {
      return heroQuery.matches ? 'assets/PhoneHero.mp4' : 'assets/HeroVideo.mp4';
    }

    // Source media is chosen once, at load. Pick again so a phone-width window
    // gets the portrait reel even if the page was opened wider and then resized.
    function useHeroSource() {
      var next = heroFile();
      var current = video.currentSrc || video.getAttribute('src') || '';
      if (current.indexOf(next) !== -1) return;
      skipped = false;
      video.src = next;
    }

    var skipped = false;
    useHeroSource();
    if (heroQuery.addEventListener) heroQuery.addEventListener('change', useHeroSource);

    function tryPlay() {
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    }

    // Multiple attempts — iOS Safari requires at least one of these to fire for muted autoplay
    tryPlay();
    video.addEventListener('loadedmetadata', tryPlay, { once: true });
    video.addEventListener('canplay',        tryPlay, { once: true });
    video.addEventListener('loadeddata',     tryPlay, { once: true });
    setTimeout(tryPlay, 100);
    setTimeout(tryPlay, 500);
    setTimeout(tryPlay, 1500);

    // Tap/click on the video itself triggers play (mobile fallback + desktop Safari)
    video.addEventListener('click', tryPlay);

    // Skip the first second of intro so the loop starts mid-motion
    var skipped = false;
    function skipIntro() {
      if (skipped) return;
      skipped = true;
      video.currentTime = 1;
    }
    video.addEventListener('loadedmetadata', skipIntro, { once: true });
    video.addEventListener('canplay', skipIntro, { once: true });
    setTimeout(skipIntro, 200);

    (function initQuoteField() {
      var section = document.querySelector('[data-quote-field]');
      if (!section) return;

      var photos = Array.prototype.slice.call(section.querySelectorAll('.home-quote-photo')).filter(function (el) {
        return window.getComputedStyle(el).display !== 'none';
      });
      if (!photos.length) return;

      var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      var copy = section.querySelector('.home-quote-copy');

      function restTransform(el) {
        var rot = el.getAttribute('data-rot') || '0';
        el.style.opacity = '1';
        el.style.transform = 'translate(-50%, -50%) rotate(' + rot + 'deg)';
        el.style.zIndex = '';
        el.style.setProperty('--lift', '0');
      }

      photos.forEach(function (el) {
        var x = parseFloat(el.getAttribute('data-x'));
        var y = parseFloat(el.getAttribute('data-y'));
        var rot = parseFloat(el.getAttribute('data-rot')) || 0;
        var delay = parseFloat(el.getAttribute('data-delay')) || 0;
        el._q = {
          x: x,
          y: y,
          rot: rot,
          depth: parseFloat(el.getAttribute('data-depth')) || 0.5,
          delay: delay,
          // Age drives the entrance/exit tween: it climbs while the section is
          // in view and falls back while it isn't, so every scroll pass through
          // the section replays the fly-in/fly-out instead of only the first.
          age: -delay * 60,
          fromX: (x - 50) * 1.25,
          fromY: (y - 50) * 1.35,
          fromRot: rot + (x > 50 ? 18 : -18),
          px: 0,
          py: 0,
          pr: rot,
          ps: 1,
          po: 0,
          vx: 0,
          vy: 0,
          vr: 0,
          primed: false,
          phase: (x * 0.17 + y * 0.13) % (Math.PI * 2),
          freq: 0.18 + ((x + y) % 17) / 58,
          amp: 0.5
        };
      });

      var STIFF = 0.14;
      var DAMP = 0.76;
      var mouse = { x: 0, y: 0, tx: 0, ty: 0, active: 0, tActive: 0 };
      var running = false;
      var visible = false;
      var sectionInView = false;
      var hasScrolledDown = false;
      var gateScrollY = window.scrollY;
      var startTime = 0;
      var lastTime = 0;
      var raf = 0;

      function springTo(state, velKey, posKey, target, stiff, damp, dt) {
        state[velKey] += (target - state[posKey]) * stiff * dt;
        state[velKey] *= Math.pow(damp, dt);
        state[posKey] += state[velKey] * dt;
      }

      function keepClearOfCopy(wx, wy, w, h, scale) {
        if (!copy) return { x: wx, y: wy };
        var rx = Math.min(copy.offsetWidth * 0.7, w * 0.28) + 48 * scale;
        var ry = Math.min(copy.offsetHeight * 0.72, h * 0.32) + 40 * scale;
        var cx = w * 0.5;
        var cy = h * 0.5;
        var nx = (wx - cx) / rx;
        var ny = (wy - cy) / ry;
        var d2 = nx * nx + ny * ny;
        if (d2 >= 1 || d2 === 0) return { x: wx, y: wy };
        var d = Math.sqrt(d2);
        var push = (1 - d) * 1.08;
        return {
          x: cx + (nx / d) * rx * (1 + push),
          y: cy + (ny / d) * ry * (1 + push)
        };
      }

      function tick(now) {
        if (!running) {
          raf = 0;
          return;
        }
        raf = requestAnimationFrame(tick);
        if (!startTime) startTime = now;
        var dt = lastTime ? Math.min(32, now - lastTime) / 16.67 : 1;
        lastTime = now;
        var t = (now - startTime) / 1000;
        var w = section.clientWidth;
        var h = section.clientHeight;
        var radius = Math.min(w, h) * 0.52;

        mouse.x += (mouse.tx - mouse.x) * (1 - Math.pow(0.92, dt));
        mouse.y += (mouse.ty - mouse.y) * (1 - Math.pow(0.92, dt));
        mouse.active += (mouse.tActive - mouse.active) * (1 - Math.pow(0.92, dt));

        var mx = (mouse.x * 0.5 + 0.5) * w;
        var my = (mouse.y * 0.5 + 0.5) * h;
        var influence = mouse.active;

        photos.forEach(function (el) {
          var q = el._q;
          var fromXpx = q.fromX * (w / 100);
          var fromYpx = q.fromY * (h / 100);
          if (!q.primed) {
            q.px = fromXpx;
            q.py = fromYpx;
            q.primed = true;
          }

          // Age rises toward its entrance target while the section is visible
          // and falls back while it isn't, so the fly-in/fly-out replays on
          // every scroll pass rather than settling permanently after the first.
          q.age += (visible ? dt : -dt * 1.6);
          if (q.age > 200) q.age = 200;
          if (q.age < -200) q.age = -200;
          var local = q.age / 60;
          var live = local >= 0;
          var intro = live ? Math.min(1, local / 1.7) : 0;
          var ease = 1 - Math.pow(1 - intro, 2.8);

          var restX = (q.x / 100) * w;
          var restY = (q.y / 100) * h;
          var dx = mx - restX;
          var dy = my - restY;
          var dist = Math.hypot(dx, dy) || 1;
          var proximity = Math.exp(-(dist * dist) / (2 * radius * radius));
          var near = proximity * influence;

          var floatX = live ? Math.sin(t * q.freq + q.phase) * q.amp : 0;
          var floatY = live ? Math.cos(t * q.freq * 0.82 + q.phase) * q.amp * 0.85 : 0;

          var followX = mouse.x * (3 + 4 * q.depth) * influence;
          var followY = mouse.y * (2 + 3 * q.depth) * influence;
          var pull = near * (2 + 2 * q.depth);
          var magX = (dx / dist) * pull;
          var magY = (dy / dist) * pull;

          var world = keepClearOfCopy(
            restX + fromXpx * (1 - ease) + followX + magX + floatX,
            restY + fromYpx * (1 - ease) + followY + magY + floatY,
            w,
            h,
            0.9 + near * 0.35
          );

          var tx = world.x - restX;
          var ty = world.y - restY;
          var tr = q.fromRot * (1 - ease) + q.rot + (live ? Math.sin(t * q.freq * 0.45 + q.phase) * 0.15 : 0) + mouse.x * q.depth * 0.35 * influence;
          var ts = 0.94 + 0.06 * ease + near * (0.018 + 0.01 * q.depth);
          var to = ease * (0.9 + 0.1 * (1 - influence) + near * 0.1);

          springTo(q, 'vx', 'px', tx, STIFF, DAMP, dt);
          springTo(q, 'vy', 'py', ty, STIFF, DAMP, dt);
          springTo(q, 'vr', 'pr', tr, 0.12, 0.8, dt);
          q.ps += (ts - q.ps) * (1 - Math.pow(0.82, dt));
          q.po += (to - q.po) * (1 - Math.pow(0.84, dt));

          el.style.opacity = q.po.toFixed(3);
          el.style.zIndex = String(Math.round(4 + q.depth * 8 + near * 24));
          el.style.setProperty('--lift', near.toFixed(3));
          el.style.transform =
            'translate(-50%, -50%) translate3d(' + q.px.toFixed(2) + 'px,' + q.py.toFixed(2) + 'px,0) rotate(' +
            q.pr.toFixed(2) + 'deg) scale(' + q.ps.toFixed(3) + ')';
        });

        // Once the section is out of view and every photo has fully receded,
        // stop the loop instead of animating an invisible field forever.
        if (!visible) {
          var allSettled = photos.every(function (el) {
            return el._q.po < 0.01 && el._q.age <= -el._q.delay * 60;
          });
          if (allSettled) stopLoop();
        }
      }

      function startLoop() {
        if (motionQuery.matches) return;
        if (running) return;
        running = true;
        lastTime = 0;
        if (!raf) raf = requestAnimationFrame(tick);
      }

      function stopLoop() {
        running = false;
        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
        }
      }

      function applyReducedMotion() {
        stopLoop();
        photos.forEach(restTransform);
      }

      function onPointerMove(e) {
        if (motionQuery.matches) return;
        var r = section.getBoundingClientRect();
        if (!r.width || !r.height) return;
        mouse.tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
        mouse.ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
        mouse.tActive = 1;
        startLoop();
      }

      function onPointerLeave() {
        mouse.tx = 0;
        mouse.ty = 0;
        mouse.tActive = 0;
      }

      section.addEventListener('pointermove', onPointerMove, { passive: true });
      section.addEventListener('pointerleave', onPointerLeave);
      section.addEventListener('pointerdown', onPointerMove, { passive: true });

      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          sectionInView = entry.isIntersecting;
          visible = sectionInView && hasScrolledDown;
          if (visible && !motionQuery.matches) startLoop();
        });
      }, { threshold: 0.12, rootMargin: '8% 0px' });
      io.observe(section);

      window.addEventListener('scroll', function () {
        if (window.scrollY > gateScrollY + 8) hasScrolledDown = true;
        visible = sectionInView && hasScrolledDown;
        if (visible && !motionQuery.matches) startLoop();
      }, { passive: true });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) stopLoop();
        else if (visible && !motionQuery.matches) startLoop();
      });

      function onMotionChange() {
        if (motionQuery.matches) applyReducedMotion();
        else if (visible) startLoop();
      }

      if (motionQuery.addEventListener) motionQuery.addEventListener('change', onMotionChange);
      else if (motionQuery.addListener) motionQuery.addListener(onMotionChange);

      if (motionQuery.matches) applyReducedMotion();
    })();
  </script>
