<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Athlena favicon">
  <style>
    :root { --favicon-color: #AD977B; }
    @media (prefers-color-scheme: dark) {
      :root { --favicon-color: #D8CDB9; }
    }
    text {
      fill: var(--favicon-color);
      font-family: "Nyght Serif", "Iowan Old Style", "Times New Roman", serif;
      font-size: 54px;
      font-style: italic;
      font-weight: 800;
      stroke: var(--favicon-color);
      stroke-width: 0.85px;
      paint-order: stroke fill;
    }
  </style>
  <rect width="64" height="64" fill="none"/>
  <text x="50%" y="76%" text-anchor="middle">A</text>
</svg>
